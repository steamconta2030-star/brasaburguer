<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel | Brasa Burger House</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #15100d;
      color: #f5eadf;
    }

    header {
      padding: 24px;
      background: #21160f;
      border-bottom: 1px solid #5a3924;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #c8b6a6;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    .topo-acoes {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .abrir-site {
      color: #e9a322;
      text-decoration: none;
      font-weight: bold;
    }

    .novo {
      background: #e9a322;
      color: #1b120d;
    }

    .produto {
      background: #211712;
      border: 1px solid #4e3425;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .produto-topo {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .produto h2 {
      margin: 0;
      color: #e9a322;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #d8c8ba;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #6c4a34;
      background: #120d0a;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .linha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .disponivel {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }

    .disponivel input {
      width: auto;
    }

    .acoes-produto {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .subir,
    .descer {
      background: #3c2b21;
      color: #fff;
    }

    .excluir {
      background: #7d2727;
      color: #fff;
    }

    .acoes {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .salvar {
      background: #e9a322;
      color: #1b120d;
    }

    .resetar {
      background: #5b3a29;
      color: #fff;
    }

    .mensagem {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      background: #264b2f;
      color: #d9ffdf;
    }

    .aviso {
      background: #2a211b;
      border: 1px solid #5a4434;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 22px;
      color: #cdbdaf;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .linha {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Painel Brasa Burger</h1>
  <p>Gerencie os produtos sem alterar o código.</p>
</header>

<main>

  <div class="topo-acoes">
    <a class="abrir-site" href="./index.html">
      ← Voltar para o cardápio
    </a>

    <button class="novo" onclick="adicionarProduto()">
      + Novo produto
    </button>
  </div>

  <div class="aviso">
    As alterações continuam salvas apenas neste navegador.
    Depois vamos migrar tudo para Supabase.
  </div>

  <div id="lista-produtos"></div>

  <div class="acoes">
    <button class="salvar" onclick="salvarProdutos()">
      Salvar alterações
    </button>

    <button class="resetar" onclick="resetarProdutos()">
      Restaurar padrão
    </button>
  </div>

  <div class="mensagem" id="mensagem">
    ✓ Alterações salvas neste navegador.
  </div>

</main>

<script>

const CHAVE_PRODUTOS = "brasaBurgerProdutos";

const produtosPadrao = [
  {
    id: "brasa-classico",
    nome: "Brasa Clássico",
    descricao: "Dois smash de 90g, queijo cheddar, cebola caramelizada e molho da casa no brioche.",
    preco: 26.90,
    categoria: "smash",
    disponivel: true
  },
  {
    id: "duplo-fumaca",
    nome: "Duplo Fumaça",
    descricao: "Dois smash de 90g, bacon crocante, queijo prato e maionese defumada.",
    preco: 31.90,
    categoria: "smash",
    disponivel: true
  },
  {
    id: "simples-brasa",
    nome: "Simples Brasa",
    descricao: "Um smash de 90g, queijo cheddar e picles no brioche. Direto ao ponto.",
    preco: 19.90,
    categoria: "smash",
    disponivel: true
  },
  {
    id: "costela-brioche",
    nome: "Costela no Brioche",
    descricao: "Costela desfiada 8h na brasa, queijo coalho grelhado e barbecue defumado.",
    preco: 36.90,
    categoria: "especiais",
    disponivel: true
  },
  {
    id: "brasa-especial-duplo",
    nome: "Brasa Especial Duplo",
    descricao: "Dois smash de 120g, queijo cheddar duplo, bacon, ovo e onion rings.",
    preco: 38.90,
    categoria: "especiais",
    disponivel: true
  },
  {
    id: "batata-rustica",
    nome: "Batata Rústica",
    descricao: "Porção generosa com alecrim e páprica defumada.",
    preco: 15.90,
    categoria: "acompanhamentos",
    disponivel: true
  },
  {
    id: "onion-rings",
    nome: "Onion Rings",
    descricao: "Anéis de cebola empanados e crocantes, com molho barbecue.",
    preco: 17.90,
    categoria: "acompanhamentos",
    disponivel: true
  },
  {
    id: "refrigerante-lata",
    nome: "Refrigerante Lata",
    descricao: "Coca-Cola, Guaraná ou Sprite, 350ml.",
    preco: 7.00,
    categoria: "bebidas",
    disponivel: true
  },
  {
    id: "suco-natural",
    nome: "Suco Natural",
    descricao: "Laranja, limão ou maracujá, 400ml.",
    preco: 10.00,
    categoria: "bebidas",
    disponivel: true
  }
];

function carregarProdutos() {
  const salvos = localStorage.getItem(CHAVE_PRODUTOS);

  if (salvos) {
    try {
      return JSON.parse(salvos);
    } catch (erro) {
      console.error("Erro ao carregar produtos:", erro);
    }
  }

  localStorage.setItem(
    CHAVE_PRODUTOS,
    JSON.stringify(produtosPadrao)
  );

  return [...produtosPadrao];
}

function obterProdutosDaTela() {
  const produtos = carregarProdutos();

  return produtos.map((produto, index) => ({
    ...produto,
    nome: document.getElementById(`nome-${index}`)?.value.trim() || produto.nome,
    descricao: document.getElementById(`descricao-${index}`)?.value.trim() || produto.descricao,
    preco: Number(document.getElementById(`preco-${index}`)?.value || produto.preco),
    categoria: document.getElementById(`categoria-${index}`)?.value || produto.categoria,
    disponivel: document.getElementById(`disponivel-${index}`)?.checked ?? produto.disponivel
  }));
}

function renderizarProdutos() {
  const produtos = carregarProdutos();
  const lista = document.getElementById("lista-produtos");

  lista.innerHTML = "";

  produtos.forEach((produto, index) => {
    const bloco = document.createElement("div");
    bloco.className = "produto";

    bloco.innerHTML = `
      <div class="produto-topo">
        <h2>${produto.nome || "Novo produto"}</h2>

        <div class="acoes-produto">
          <button class="subir" onclick="moverProduto(${index}, -1)">
            ↑ Subir
          </button>

          <button class="descer" onclick="moverProduto(${index}, 1)">
            ↓ Descer
          </button>

          <button class="excluir" onclick="excluirProduto(${index})">
            Excluir
          </button>
        </div>
      </div>

      <label>Nome do produto</label>
      <input
        type="text"
        id="nome-${index}"
        value="${produto.nome}"
      />

      <label>Descrição</label>
      <textarea id="descricao-${index}">${produto.descricao}</textarea>

      <div class="linha">
        <div>
          <label>Preço (R$)</label>
          <input
            type="number"
            step="0.01"
            min="0"
            id="preco-${index}"
            value="${produto.preco}"
          />
        </div>

        <div>
          <label>Categoria</label>
          <select id="categoria-${index}">
            <option value="smash" ${produto.categoria === "smash" ? "selected" : ""}>
              Smash Burgers
            </option>

            <option value="especiais" ${produto.categoria === "especiais" ? "selected" : ""}>
              Especiais
            </option>

            <option value="acompanhamentos" ${produto.categoria === "acompanhamentos" ? "selected" : ""}>
              Acompanhamentos
            </option>

            <option value="bebidas" ${produto.categoria === "bebidas" ? "selected" : ""}>
              Bebidas
            </option>
          </select>
        </div>
      </div>

      <label class="disponivel">
        <input
          type="checkbox"
          id="disponivel-${index}"
          ${produto.disponivel ? "checked" : ""}
        />
        Produto disponível no cardápio
      </label>
    `;

    lista.appendChild(bloco);
  });
}

function salvarProdutos() {
  const atualizados = obterProdutosDaTela();

  localStorage.setItem(
    CHAVE_PRODUTOS,
    JSON.stringify(atualizados)
  );

  mostrarMensagem("✓ Alterações salvas neste navegador.");

  renderizarProdutos();
}

function adicionarProduto() {
  const produtos = obterProdutosDaTela();

  produtos.push({
    id: "produto-" + Date.now(),
    nome: "Novo produto",
    descricao: "Descrição do produto",
    preco: 0,
    categoria: "smash",
    disponivel: true
  });

  localStorage.setItem(
    CHAVE_PRODUTOS,
    JSON.stringify(produtos)
  );

  renderizarProdutos();
}

function excluirProduto(index) {
  const produtos = obterProdutosDaTela();

  const confirmar = confirm(
    `Deseja excluir "${produtos[index].nome}"?`
  );

  if (!confirmar) return;

  produtos.splice(index, 1);

  localStorage.setItem(
    CHAVE_PRODUTOS,
    JSON.stringify(produtos)
  );

  renderizarProdutos();

  mostrarMensagem("✓ Produto excluído.");
}

function moverProduto(index, direcao) {
  const produtos = obterProdutosDaTela();

  const novoIndex = index + direcao;

  if (
    novoIndex < 0 ||
    novoIndex >= produtos.length
  ) {
    return;
  }

  const temporario = produtos[index];
  produtos[index] = produtos[novoIndex];
  produtos[novoIndex] = temporario;

  localStorage.setItem(
    CHAVE_PRODUTOS,
    JSON.stringify(produtos)
  );

  renderizarProdutos();
}

function resetarProdutos() {
  const confirmar = confirm(
    "Deseja restaurar todos os produtos para os valores originais?"
  );

  if (!confirmar) return;

  localStorage.setItem(
    CHAVE_PRODUTOS,
    JSON.stringify(produtosPadrao)
  );

  renderizarProdutos();

  mostrarMensagem("✓ Cardápio restaurado.");
}

function mostrarMensagem(texto) {
  const mensagem = document.getElementById("mensagem");

  mensagem.textContent = texto;
  mensagem.style.display = "block";

  setTimeout(() => {
    mensagem.style.display = "none";
  }, 2500);
}

renderizarProdutos();

</script>

</body>
</html>
